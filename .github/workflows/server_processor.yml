name: Server Processor Workflow

on:
  # cron設定
  # 毎日午前2時（JST）に実行
  schedule:
    - cron: '0 17 * * *'  # UTC 17:00 = JST 02:00
  workflow_dispatch:  # 手動実行も可能
    inputs:
      process:
        description: '処理対象'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - meals
          - classes
          - dormitory_events
          - annual_events
          - rules
      regenerate:
        description: '強制再生成する対象'
        required: false
        default: 'none'
        type: choice
        options:
          - none
          - meals:latest
          - meals:current
          - meals:next
          - meals:all
          - classes
          - dormitory_events
          - annual_events

jobs:
  process:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Configure Wakayama NCT certificate bundle
        run: |
          python - <<'PY'
          import certifi
          import os
          import pathlib
          import ssl
          import urllib.request

          urls = [
              "http://repo1.secomtrust.net/sppca/nii/odca4/nii-odca4g8rsa.cer",
              "http://repo2.secomtrust.net/root/tlsrsa/tlsrsarootca2024.cer",
          ]
          bundle = pathlib.Path("wakayama-ca-bundle.pem").resolve()
          content = pathlib.Path(certifi.where()).read_text(encoding="utf-8")
          for url in urls:
              with urllib.request.urlopen(url, timeout=30) as response:
                  content += "\n" + ssl.DER_cert_to_PEM_cert(response.read())
          bundle.write_text(content, encoding="utf-8")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              print(f"REQUESTS_CA_BUNDLE={bundle}", file=env)
              print(f"SSL_CERT_FILE={bundle}", file=env)
          PY
      
      - name: Process PDFs
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUBACCOUNT_TOKEN }}
          SERVER_REPO_URL: ${{ secrets.SERVER_REPO_URL }}
          PROCESS_TARGET: ${{ github.event.inputs.process || 'all' }}
          REGENERATE_TARGET: ${{ github.event.inputs.regenerate || 'none' }}
        run: |
          REGENERATE_ARGS=()
          if [ -n "$REGENERATE_TARGET" ] && [ "$REGENERATE_TARGET" != "none" ]; then
            REGENERATE_ARGS+=(--regenerate "$REGENERATE_TARGET")
          fi

          # model: OpenAI公式APIのGPT-5.5を使う
          # fallback-model: OpenAI側が失敗した場合はKimiにフォールバックする
          # rules-model: とりあえず安いGPT-OSS-120Bを指定する
          # openrouter-provider: 安く出力トークンが大きいプロバイダを指定して品質の悪いプロバイダにルーティングされないようにする
          python -X utf8 main.py \
            --process "$PROCESS_TARGET" \
            --output-dir ./output \
            --model gpt-5.5 \
            --fallback-model moonshotai/kimi-k2.6 \
            --annual-events-model gpt-5.5 \
            --annual-events-reasoning-effort medium \
            --rules-provider openrouter \
            --rules-model openai/gpt-oss-120b:free,openai/gpt-oss-120b \
            --update-server \
            --server-repo-url "$SERVER_REPO_URL" \
            --branch main \
            --use-yomitoku \
            --openrouter-provider '{"order":["venice/int4","parasail/int4","inceptron/int4","io-net/int4"],"allow_fallbacks":true}' \
            --rules-openrouter-provider '{"order":["deepinfra/fp4","ncompass","novita/fp4"],"allow_fallbacks":true}' \
            "${REGENERATE_ARGS[@]}"
      
      - name: Upload output artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output
          path: output/
          retention-days: 7


